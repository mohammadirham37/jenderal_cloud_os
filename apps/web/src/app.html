<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#0b1118" />
		<meta name="application-name" content="Jenderal Cloud OS" />
		<meta name="apple-mobile-web-app-title" content="Jenderal" />
		<title>Jenderal Cloud OS</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			href="%sveltekit.assets%/brand/favicon-32.png"
			type="image/png"
			sizes="32x32"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script nonce="%sveltekit.nonce%">
			// Apply the saved theme before first paint to avoid a flash.
			(function () {
				try {
					var t = localStorage.getItem('itk-theme') || 'system';
					var dark =
						t === 'dark' ||
						(t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-surface text-fg antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
