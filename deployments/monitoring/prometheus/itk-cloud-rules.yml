# Infrastructure alert rules. The ITK Cloud worker evaluates its own
# application-level alerts (agent offline, backups, job queue) and shows them
# in the console; these rules cover the host itself.
groups:
  - name: itk-cloud-host
    rules:
      - alert: HostDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}) * 100 > 90
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is over 90% full"
      - alert: HostMemoryCritical
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Host memory usage above 90%"
      - alert: HostHighCPU
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Sustained CPU usage above 90% for 15 minutes"
      - alert: ItkCloudServiceFailed
        expr: node_systemd_unit_state{name=~"itk-cloud-.*\\.service|postgresql.*|redis-server.service|docker.service|caddy.service", state="failed"} == 1
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Service {{ $labels.name }} failed"
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "node_exporter is not reachable"
