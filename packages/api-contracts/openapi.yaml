      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Workspace metrics.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkspaceMetrics' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/monitoring/gpu:
    get:
      tags: [Monitoring]
      operationId: getGPUMetrics
      summary: Live GPU inventory/metrics (monitoring.view_host or gpu.view)
      description: Process details are removed for callers without monitoring.view_host.
      responses:
        '200':
          description: GPU inventory; `available=false` with `error` when unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GPUInventory' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/monitoring/history:
    get:
      tags: [Monitoring]
      operationId: getMetricsHistory
      summary: Bucketed metric history
      description: |
        `host` requires monitoring.view_host; `gpu` requires monitoring.view_host or gpu.view
        (`ref` = GPU UUID); `workspace`/`container` require operate access to the workspace
        (or monitoring.view_host). Bucket sizes: 1h→60 s, 6h→300 s, 24h→900 s, 7d→3600 s, 14d→7200 s.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [host, workspace, container, gpu], default: host }
        - name: ref
          in: query
          description: Workspace/container UUID or GPU UUID; ignored for host.
          schema: { type: string }
        - name: range
          in: query
          schema: { type: string, enum: [1h, 6h, 24h, 7d, 14d], default: 1h }
      responses:
        '200':
          description: History.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MetricsHistory' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/monitoring/alerts:
    get:
      tags: [Monitoring]
      operationId: listAlerts
      summary: Alerts, firing first (monitoring.view_host) — max 200
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [firing] }
      responses:
        '200':
          description: Alerts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/monitoring/alerts/{id}/ack:
    post:
      tags: [Monitoring]
      operationId: acknowledgeAlert
      summary: Acknowledge an alert (monitoring.view_host)
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Acknowledged.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/monitoring/services:
    get:
      tags: [Monitoring]
      operationId: getServiceStatus
      summary: Platform service health, queue, last backup and container counts (monitoring.view_host or host.operations.view)
      responses:
        '200':
          description: Service status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ServicesStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/monitoring/jobs:
    get:
      tags: [Monitoring]
      operationId: listJobs
      summary: Background jobs by status (monitoring.view_host) — max 100
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [dead, queued, running], default: dead }
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JobRecord' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/monitoring/jobs/{id}/retry:
    post:
      tags: [Monitoring]
      operationId: retryJob
      summary: Re-queue a dead job (settings.manage or workspaces.manage_all)
      description: Resets attempts to 0 and runs the job immediately.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Re-queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Notifications & announcements
  # ---------------------------------------------------------------------------
  /api/v1/notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Own notifications, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: unread
          in: query
          schema: { type: boolean }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/NotificationType' }
      responses:
        '200':
          description: Page of notifications; `meta.unread` counts all unread notifications.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/ListMeta'
                      - type: object
                        required: [unread]
                        properties:
                          unread: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getUnreadCount
      summary: Number of unread notifications
      responses:
        '200':
          description: Count.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [unread]
                    properties:
                      unread: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all own notifications read
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one own notification read
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/announcements:
    get:
      tags: [Notifications]
      operationId: listAnnouncements
      summary: Active announcements (all with ?all=true and announcements.manage) — max 50
      parameters:
        - name: all
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Announcements.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Announcement' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Notifications]
      operationId: createAnnouncement
      summary: Publish an announcement (announcements.manage)
      description: 'With `notify: true` every active user also receives a `maintenance` notification.'
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                body: { type: string, maxLength: 5000 }
                severity: { type: string, enum: [info, warning, critical], default: info }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                notify: { type: boolean }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/announcements/{id}:
    delete:
      tags: [Notifications]
      operationId: deleteAnnouncement
      summary: Delete an announcement (announcements.manage)
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Administration
  # ---------------------------------------------------------------------------
  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      operationId: listAuditLogs
      summary: Query the audit log (audit.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
        - name: sort
          in: query
          schema:
            type: string
            enum: [occurred_at, -occurred_at, action, -action]
            default: -occurred_at
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          description: Action, `*` acts as wildcard (e.g. `workspace.*`).
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Page of audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/agent/status:
    get:
      tags: [Admin]
      operationId: getAgentStatus
      summary: Host agent status with a live check (agent.view or host.operations.view)
      responses:
        '200':
          description: Agent status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AgentStatus' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      summary: Platform settings with schema and current values (settings.manage)
      responses:
        '200':
          description: Settings sorted by category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Admin]
      operationId: updateSettings
      summary: Change settings (settings.manage)
      description: Only declared keys; values are type- and range-checked. The change (from/to) is audited.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [values]
              properties:
                values:
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: [string, integer, boolean]
            example:
              values:
                alerts.disk_pct: 85
                backup.include_workspace_files: true
      responses:
        '200':
          description: All settings after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/backups:
    get:
      tags: [Admin]
      operationId: listBackups
      summary: Backup jobs and backup configuration (backup.manage)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of backups plus `config`.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, config]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BackupJob' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
                  config: { $ref: '#/components/schemas/BackupConfig' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Admin]
      operationId: createBackup
      summary: Start a backup (backup.manage) — asynchronous
      description: '`full` creates one job per kind (project_databases only when configured). 409 when BACKUP_AGE_RECIPIENT is not set (backups are always encrypted).'
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [full, platform_db, config, workspace_metadata, workspace_files, project_databases] }
      responses:
        '202':
          description: Backup jobs created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [backup_ids]
                    properties:
                      backup_ids:
                        type: array
                        items: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/backups/{id}/restore:
    post:
      tags: [Admin]
      operationId: restoreBackup
      summary: Restore or verify a backup (backup.manage) — asynchronous
      description: |
        `workspace_files` and `project_databases` are restored (project database restores need
        `database_id`); `platform_db`, `config` and `workspace_metadata` are only **verified**
        (decrypt + checksum, `pg_restore --list` for the platform dump) — live restore of those
        is CLI-only. `confirm` must equal the backup `file_name`. The age private key is
        encrypted with the platform key inside the single-attempt restore job and scrubbed
        from the job payload when the job finishes.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, age_identity, reason]
              properties:
                confirm: { type: string, description: Must equal the backup file name. }
                age_identity: { type: string, pattern: '^AGE-SECRET-KEY-', description: The offline age private key. }
                mode: { type: string, enum: [restore, verify], default: restore }
                workspace_id: { type: string, format: uuid, description: workspace_files only — restore a single workspace. }
                database_id: { type: string, format: uuid, description: Required to restore a project database. }
                reason: { type: string, minLength: 5 }
      responses:
        '202':
          description: Restore queued; poll `restore_status`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/BackupJob' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/host/emergency-stop:
    post:
      tags: [Admin]
      operationId: emergencyStop
      summary: Stop all managed containers (host.operations.execute)
      description: Requires the confirmation phrase `STOP ALL WORKLOADS` and a reason of at least 10 characters. Running workspaces become `stopped`, terminals close, every user is notified. Denied attempts are audited.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm, reason]
              properties:
                confirm: { type: string, const: STOP ALL WORKLOADS }
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Result reported by the agent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      stopped: { type: integer }
                      failed: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: itk_session
      description: Opaque session token (32 random bytes); only its SHA-256 is stored server-side.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Per-session CSRF token (`csrf_token` of GET /api/v1/auth/me). Required with the session cookie on POST/PUT/PATCH/DELETE.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource UUID (a malformed UUID yields 404).
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Q:
      name: q
      in: query
      description: Case-insensitive substring search (max 100 characters).
      schema: { type: string, maxLength: 100 }
    FilePath:
      name: path
      in: query
      description: Workspace-relative path; "" or "/" is the workspace root. `..` segments, NUL bytes and paths longer than 4096 bytes are rejected.
      schema: { type: string, maxLength: 4096 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: '8–100 characters. A repeated request with the same key by the same user within 24 h replays the stored 2xx response (`Idempotent-Replay: true`); reusing it for a different method/path returns 409.'
      schema: { type: string, minLength: 8, maxLength: 100 }
    AccessReason:
      name: X-Access-Reason
      in: header
      required: false
      description: Justification (≥ 10 characters) required when a holder of `workspaces.access_all` accesses data of a workspace they do not own or edit (emergency access). Audited as `workspace.emergency_access`.
      schema: { type: string, minLength: 10 }
    ProxyPort:
      name: port
      in: path
      required: true
      schema: { type: integer, minimum: 1024, maximum: 65535 }
    ProxyPath:
      name: path
      in: path
      required: true
      description: Remainder of the URL path (may contain `/`; matched by Go's `{rest...}` wildcard).
      schema: { type: string }

  requestBodies:
    OptionalReason:
      required: false
      description: Optional; the body may be omitted.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason: { type: string, maxLength: 500 }

  responses:
    BadRequest:
      description: '`bad_request` — malformed JSON, unknown field, invalid multipart.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: '`unauthorized` — no valid session.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: '`forbidden`, `csrf_failed`, `mfa_required`, `password_change_required` or `emergency_reason_required`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: '`not_found` — also returned when the caller has no access to the resource.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: '`conflict` — invalid state transition, operation already in progress, duplicate.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: '`validation_failed` (field `details`) or `quota_exceeded`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: validation_failed
              message: Some fields are invalid.
              details:
                cpu_millis: must be between 500 (template minimum) and 1000 (your quota)
              request_id: 9f2c1d0e8b7a4c3d2e1f0a9b8c7d6e5f
    TooManyRequests:
      description: '`rate_limited`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: '`unavailable` (agent, Redis, feature not configured) or `insufficient_capacity`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: '`payload_too_large`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMediaType:
      description: '`unsupported_media_type`, `unsupported_file_type` or `binary_file`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InsufficientStorage:
      description: '`quota_exceeded` — workspace storage is full.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: '`internal_error` — details are only logged server-side.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    WorkspaceAccepted:
      description: Accepted; the lifecycle job is queued. Returns the workspace with `pending_job`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceEnvelope' }
    ContainerAccepted:
      description: Accepted; the container job is queued.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ContainerEnvelope' }

  schemas:
    # ----- envelopes & common -----
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code.
              examples: [validation_failed, quota_exceeded, not_found]
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
            request_id: { type: string }
    ListMeta:
      type: object
      required: [page, per_page, total]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    HealthReady:
      type: object
      required: [status, checks, version]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok, unavailable] }
            redis: { type: string, enum: [ok, unavailable] }
            migrations: { type: string, enum: [ok, pending] }
        version: { type: string }
    PublicConfig:
      type: object
      properties:
        platform_name: { type: string }
        version: { type: string }
        app_proxy_origin: { type: string, description: Empty when the app proxy is disabled. }
        upload_max_bytes: { type: integer, format: int64 }
        editor_max_bytes: { type: integer, format: int64 }
        gpu_enabled: { type: boolean }
        native_workspaces: { type: boolean }
        project_databases: { type: boolean }
        email_enabled: { type: boolean }
        terminal_ttl_minutes: { type: integer }
    NewPassword:
      type: string
      minLength: 12
      maxLength: 256
      description: At least 12 characters with at least three of lowercase, uppercase, digits, symbols.

    # ----- auth -----
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, maxLength: 254, description: Username or email (case-insensitive). }
        password: { type: string, maxLength: 256 }
    MFACodeRequest:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
        recovery_code: { type: string, description: Only for /auth/mfa/verify. }
    Me:
      type: object
      required: [id, username, full_name, email, roles, permissions, mfa_enrolled, mfa_required, mfa_verified, mfa_setup_required, must_change_password, csrf_token, session_expires_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        full_name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        mfa_enrolled: { type: boolean }
        mfa_required: { type: boolean }
        mfa_verified: { type: boolean }
        mfa_setup_required: { type: boolean }
        must_change_password: { type: boolean }
        csrf_token: { type: string }
        session_expires_at: { type: string, format: date-time }
    MeEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Me' }
    SessionView:
      type: object
      properties:
        id: { type: string, format: uuid }
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }

    # ----- users, roles, quotas -----
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        full_name: { type: string }
        identity_number: { type: [string, 'null'], description: e.g. NIM/NIP. }
        status: { type: string, enum: [active, suspended] }
        suspended_reason: { type: [string, 'null'] }
        must_change_password: { type: boolean }
        roles:
          type: array
          items: { type: string }
        quota_id: { type: [string, 'null'], format: uuid }
        quota_key: { type: [string, 'null'] }
        mfa_enabled: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
        locked_until: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    UserRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        full_name: { type: string }
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, email, full_name, roles]
      properties:
        username: { type: string, pattern: '^[a-z][a-z0-9._-]{2,31}$' }
        email: { type: string, format: email, maxLength: 254 }
        full_name: { type: string, minLength: 1, maxLength: 200 }
        identity_number: { type: [string, 'null'], maxLength: 50 }
        roles:
          type: array
          minItems: 1
          items: { type: string }
        quota_key: { type: [string, 'null'] }
        password: { type: [string, 'null'], description: Optional; generated when omitted. }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        full_name: { type: string, minLength: 1, maxLength: 200 }
        identity_number: { type: string, maxLength: 50, description: '"" clears.' }
        quota_key: { type: string, description: '"" clears the explicit package.' }
        roles:
          type: array
          minItems: 1
          items: { type: string }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        is_system: { type: boolean }
        requires_mfa: { type: boolean }
        rank: { type: integer }
        permissions:
          type: array
          items: { type: string }
        user_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Role' }
    RoleInput:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9_]{1,40}$', description: Create only. }
        name: { type: string, maxLength: 80 }
        description: { type: string }
        requires_mfa: { type: boolean }
        rank: { type: integer, minimum: 1 }
        permissions:
          type: array
          items: { type: string }
    Permission:
      type: object
      properties:
        key: { type: string, examples: [workspaces.create] }
        category: { type: string }
        description: { type: string }
    Quota:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        cpu_millis: { type: integer, description: 1000 = one core. }
        memory_bytes: { type: integer, format: int64 }
        storage_bytes: { type: integer, format: int64 }
        max_workspaces: { type: integer }
        max_containers: { type: integer }
        max_databases: { type: integer }
        max_terminal_sessions: { type: integer }
        gpu_allowed: { type: boolean }
        max_workspace_duration_min: { type: [integer, 'null'] }
        idle_timeout_min: { type: [integer, 'null'] }
        user_count: { type: integer }
        project_count: { type: integer }
    QuotaEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Quota' }
    QuotaInput:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,62}$', description: Create only. }
        name: { type: string, maxLength: 80 }
        description: { type: string }
        cpu_millis: { type: integer, minimum: 100, maximum: 256000 }
        memory_bytes: { type: integer, format: int64, minimum: 134217728, maximum: 2199023255552 }
        storage_bytes: { type: integer, format: int64, minimum: 268435456, maximum: 70368744177664 }
        max_workspaces: { type: integer, minimum: 0, maximum: 1000 }
        max_containers: { type: integer, minimum: 0, maximum: 1000 }
        max_databases: { type: integer, minimum: 0, maximum: 1000 }
        max_terminal_sessions: { type: integer, minimum: 0, maximum: 1000 }
        gpu_allowed: { type: boolean }
        max_workspace_duration_min: { type: integer, minimum: 0, maximum: 525600, description: 0 = no limit. }
        idle_timeout_min: { type: integer, minimum: 0, maximum: 525600, description: 0 = no limit. }
    Usage:
      type: object
      description: Aggregate usage. Running CPU/memory count running containers (plus running native workspaces); allocated storage sums workspace storage allocations.
      properties:
        workspaces: { type: integer }
        containers: { type: integer }
        databases: { type: integer }
        terminal_sessions: { type: integer }
        running_cpu_millis: { type: integer }
        running_memory_bytes: { type: integer, format: int64 }
        allocated_storage_bytes: { type: integer, format: int64 }
        used_storage_bytes: { type: integer, format: int64 }
        active_gpu_allocations: { type: integer }
    QuotaUsageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [quota, usage]
          properties:
            quota: { $ref: '#/components/schemas/Quota' }
            usage: { $ref: '#/components/schemas/Usage' }
    DashboardSummary:
      type: object
      properties:
        quota: { $ref: '#/components/schemas/Quota' }
        usage: { $ref: '#/components/schemas/Usage' }
        workspaces_by_status:
          type: object
          additionalProperties: { type: integer }
        recent_activity:
          type: array
          items: { $ref: '#/components/schemas/ActivityItem' }
        gpu:
          type: object
          properties:
            pending_requests: { type: integer }
            active_allocations: { type: integer }
        projects: { type: integer }
        platform:
          type: object
          description: Only with monitoring.view_host.
          properties:
            active_users: { type: integer }
            running_workspaces: { type: integer }
            running_containers: { type: integer }
            pending_gpu_requests: { type: integer }
            firing_alerts: { type: integer }

    # ----- projects -----
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        quota_id: { type: [string, 'null'], format: uuid }
        quota_key: { type: [string, 'null'] }
        status: { type: string, enum: [active, archived] }
        member_count: { type: integer }
        workspace_count: { type: integer }
        database_count: { type: integer }
        my_role: { type: [string, 'null'], enum: [owner, maintainer, member, viewer, null] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 120 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$', description: Create only; derived from name when omitted. }
        description: { type: string, maxLength: 2000 }
        quota_key: { type: string, description: Requires quotas.manage. }
        status: { type: string, enum: [active, archived], description: Update only (owner). }
    ProjectMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        full_name: { type: string }
        role: { type: string, enum: [owner, maintainer, member, viewer] }
        created_at: { type: string, format: date-time }
    ProjectDetailEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [project, members, usage, can_manage, is_owner]
          properties:
            project: { $ref: '#/components/schemas/Project' }
            members:
              type: array
              items: { $ref: '#/components/schemas/ProjectMember' }
            usage: { $ref: '#/components/schemas/Usage' }
            quota:
              oneOf:
                - $ref: '#/components/schemas/Quota'
                - type: 'null'
            can_manage: { type: boolean }
            is_owner: { type: boolean }
    ActivityItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_username: { type: [string, 'null'] }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }

    # ----- templates & images -----
    TemplatePort:
      type: object
      required: [port, name]
      properties:
        port: { type: integer, minimum: 1024, maximum: 65535 }
        name: { type: string, maxLength: 40 }
        proxy: { type: boolean, description: The app understands the proxy base path (ITK_PROXY_BASE); otherwise the prefix is stripped. }
        host_port: { type: integer, description: Loopback host port assigned at container start (containers only). }
    Template:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        image_id: { type: string, format: uuid }
        image_reference: { type: string }
        image_allowed: { type: boolean }
        image_present: { type: boolean, description: The image was found/pulled on the host at least once. }
        runtime_versions:
          type: object
          additionalProperties: { type: string }
        min_cpu_millis: { type: integer }
        min_memory_bytes: { type: integer, format: int64 }
        rec_cpu_millis: { type: integer }
        rec_memory_bytes: { type: integer, format: int64 }
        default_storage_bytes: { type: integer, format: int64 }
        ports:
          type: array
          items: { $ref: '#/components/schemas/TemplatePort' }
        gpu_mode: { type: string, enum: [none, optional, required] }
        security:
          type: object
          properties:
            run_as_uid: { type: integer }
            run_as_gid: { type: integer }
            no_new_privileges: { type: boolean }
            read_only_rootfs: { type: boolean }
            cap_add:
              type: array
              items: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        command:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Template' }
    TemplateInput:
      type: object
      additionalProperties: false
      properties:
        key: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$', description: Create only. }
        name: { type: string, maxLength: 80 }
        description: { type: string }
        category: { type: string, default: general }
        image_id: { type: string, format: uuid }
        runtime_versions:
          type: object
          additionalProperties: { type: string }
        min_cpu_millis: { type: integer, minimum: 100, maximum: 64000 }
        min_memory_bytes: { type: integer, format: int64, minimum: 67108864 }
        rec_cpu_millis: { type: integer }
        rec_memory_bytes: { type: integer, format: int64 }
        default_storage_bytes: { type: integer, format: int64, minimum: 268435456 }
        ports:
          type: array
          maxItems: 16
          items: { $ref: '#/components/schemas/TemplatePort' }
        gpu_mode: { type: string, enum: [none, optional, required] }
        env:
          type: object
          propertyNames: { pattern: '^[A-Z_][A-Z0-9_]{0,63}$' }
          additionalProperties: { type: string, maxLength: 4096 }
        command:
          type: array
          maxItems: 64
          items: { type: string }
        read_only_rootfs: { type: boolean }
        is_active: { type: boolean }
    Image:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        reference: { type: string, examples: ['jenderal/ubuntu-dev:1.0'] }
        description: { type: string }
        gpu_capable: { type: boolean }
        is_allowed: { type: boolean }
        pulled_at: { type: [string, 'null'], format: date-time }
        size_bytes: { type: [integer, 'null'], format: int64 }
        template_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ImageEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Image' }
    ImageInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        reference: { type: string, pattern: '^[a-z0-9][a-z0-9._/:@-]{1,250}$', description: Create only. }
        description: { type: string }
        gpu_capable: { type: boolean }
        is_allowed: { type: boolean, default: true }

    # ----- workspaces -----
    WorkspaceStatus:
      type: string
      enum: [requested, provisioning, ready, running, stopped, suspended, failed, deleting, deleted]
    Workspace:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        project_id: { type: [string, 'null'], format: uuid }
        project_name: { type: [string, 'null'] }
        template_id: { type: string, format: uuid }
        template_key: { type: string }
        template_name: { type: string }
        type: { type: string, enum: [container, native] }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        status_reason: { type: [string, 'null'] }
        cpu_millis: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        storage_bytes: { type: integer, format: int64 }
        pids_limit: { type: integer }
        idle_timeout_min: { type: [integer, 'null'] }
        max_duration_min: { type: [integer, 'null'] }
        storage_used_bytes: { type: [integer, 'null'], format: int64 }
        last_activity_at: { type: [string, 'null'], format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        access:
          type: string
          enum: [owner, editor, operator, viewer, none]
          description: Caller's effective access (omitted when not computed).
        pending_job:
          type: [string, 'null']
          description: Kind of the queued/running lifecycle job (e.g. `workspace.provision`), null when idle.
    WorkspaceEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Workspace' }
    WorkspaceCreateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        template_id: { type: string, format: uuid, description: template_id or template_key is required. }
        template_key: { type: string }
        project_id: { type: string, format: uuid, description: The owner must be a project member other than viewer. }
        type: { type: string, enum: [container, native], description: Defaults to WORKSPACE_DEFAULT_DRIVER (docker → container). }
        cpu_millis: { type: integer, description: Defaults to the template recommendation; must be within template minimum and quota. }
        memory_bytes: { type: integer, format: int64 }
        storage_bytes: { type: integer, format: int64, minimum: 268435456, description: Defaults to the template default. }
        idle_timeout_min: { type: integer, minimum: 5, maximum: 10080, description: Defaults to the quota idle timeout. }
        owner_id: { type: string, format: uuid, description: Create on behalf of another user (workspaces.manage_all). }
    Grants:
      type: object
      description: Effective workspace grants (field names are capitalised in the JSON output).
      properties:
        View: { type: boolean }
        Operate: { type: boolean }
        Edit: { type: boolean }
        Manage: { type: boolean }
        Emergency: { type: boolean, description: Edit is granted only through workspaces.access_all. }
    WorkspaceMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        full_name: { type: string }
        role: { type: string, enum: [viewer, editor] }
    WorkspaceDetail:
      allOf:
        - $ref: '#/components/schemas/Workspace'
        - type: object
          required: [containers, template, members, grants]
          properties:
            containers:
              type: array
              items: { $ref: '#/components/schemas/Container' }
            template: { $ref: '#/components/schemas/Template' }
            members:
              type: array
              items: { $ref: '#/components/schemas/WorkspaceMember' }
            grants: { $ref: '#/components/schemas/Grants' }
    WorkspaceJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, examples: [workspace.start] }
        status: { type: string, enum: [queued, running, succeeded, failed, dead, cancelled] }
        attempts: { type: integer }
        last_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    # ----- files & terminals -----
    FileEntry:
      type: object
      properties:
        name: { type: string }
        path: { type: string, description: Workspace-relative path. }
        type: { type: string, enum: [file, dir, symlink, other] }
        size: { type: integer, format: int64 }
        mode: { type: string, examples: [-rw-r--r--] }
        mod_time: { type: string, format: date-time }
    FileContent:
      type: object
      properties:
        path: { type: string }
        content: { type: string }
        size: { type: integer, format: int64 }
        mod_time: { type: string, format: date-time, description: RFC 3339 with nanoseconds; pass back as expected_mod_time. }
    TerminalSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        container_id: { type: [string, 'null'], format: uuid }
        container_name: { type: [string, 'null'] }
        status: { type: string, enum: [pending, active, closed, expired] }
        created_at: { type: string, format: date-time }
        connected_at: { type: [string, 'null'], format: date-time }
        last_activity_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        end_reason: { type: [string, 'null'] }
        websocket_path: { type: string, examples: [/api/v1/terminals/0b9c.../ws] }

    # ----- containers -----
    ContainerStatus:
      type: string
      enum: [created, starting, running, stopping, stopped, failed, removing, removed]
    Container:
      type: object
      properties:
        id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        owner_id: { type: string, format: uuid }
        owner_username: { type: string }
        template_id: { type: string, format: uuid }
        template_name: { type: string }
        image_id: { type: string, format: uuid }
        image: { type: string }
        name: { type: string }
        is_primary: { type: boolean }
        runtime_id: { type: [string, 'null'], description: Docker container ID. }
        status: { $ref: '#/components/schemas/ContainerStatus' }
        status_reason: { type: [string, 'null'] }
        cpu_millis: { type: integer }
        memory_bytes: { type: integer, format: int64 }
        pids_limit: { type: integer }
        ports:
          type: array
          items: { $ref: '#/components/schemas/TemplatePort' }
        gpu_device_ids:
          type: array
          items: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pending_job: { type: [string, 'null'] }
    ContainerEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Container' }
    ContainerState:
      type: object
      properties:
        runtime_id: { type: string }
        status: { type: string, enum: [created, running, paused, restarting, removing, exited, dead, missing, removed] }
        exit_code: { type: integer }
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        oom_killed: { type: boolean }
        host_ports:
          type: object
          additionalProperties: { type: integer }
    ContainerStats:
      type: object
      properties:
        runtime_id: { type: string }
        cpu_percent: { type: number, description: Percent of one core (150 = 1.5 cores). }
        memory_bytes: { type: integer, format: int64 }
        memory_limit: { type: integer, format: int64 }
        pids: { type: integer, format: int64 }
        net_rx_bytes: { type: integer, format: int64 }
        net_tx_bytes: { type: integer, format: int64 }
    ContainerDetail:
      allOf:
        - $ref: '#/components/schemas/Container'
        - type: object
          properties:
            runtime:
              oneOf:
                - $ref: '#/components/schemas/ContainerState'
                - type: 'null'
            runtime_error: { type: string }
            stats:
              oneOf:
                - $ref: '#/components/schemas/ContainerStats'
                - type: 'null'
    LogsResult:
      type: object
      properties:
        lines:
          type: array
          items: { type: string }
        truncated: { type: boolean }

    # ----- databases -----
    Database:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        project_name: { type: string }
        created_by: { type: string, format: uuid }
        created_by_username: { type: string }
        display_name: { type: string }
        db_name: { type: string, pattern: '^itk_[a-z0-9_]{3,55}$' }
        role_name: { type: string, description: Equal to db_name. }
        engine: { type: string, enum: [postgresql] }
        status: { type: string, enum: [provisioning, ready, failed, deleting, deleted] }
        status_reason: { type: [string, 'null'] }
        size_bytes: { type: [integer, 'null'], format: int64 }
        connection_limit: { type: integer }
        last_backup_at: { type: [string, 'null'], format: date-time }
        last_backup_status: { type: [string, 'null'] }
        host: { type: string, description: PROJECT_DB_HOST }
        port: { type: integer, description: PROJECT_DB_PORT }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DatabaseCredentials:
      type: object
      description: Returned only on creation and credential reset.
      properties:
        host: { type: string }
        port: { type: integer }
        database: { type: string }
        username: { type: string }
        password: { type: string }
        connection_string: { type: string, examples: ['postgresql://itk_x:pw@10.0.0.1:5432/itk_x?sslmode=prefer'] }

    # ----- GPU -----
    GPUDevice:
      type: object
      properties:
        id: { type: string, format: uuid }
        uuid: { type: string, examples: [GPU-00000000-1111-2222-3333-444444444444] }
        index: { type: integer }
        name: { type: string }
        driver_version: { type: [string, 'null'] }
        cuda_version: { type: [string, 'null'] }
        memory_total_bytes: { type: [integer, 'null'], format: int64 }
        memory_used_bytes: { type: [integer, 'null'], format: int64 }
        utilization_pct: { type: [integer, 'null'] }
        temperature_c: { type: [integer, 'null'] }
        mig_mode: { type: [string, 'null'] }
        allocation_policy: { type: string, enum: [exclusive, shared, disabled] }
        max_shared: { type: integer }
        status: { type: string, enum: [available, missing, disabled] }
        active_allocations: { type: integer }
        last_seen_at: { type: string, format: date-time }
    GPUProcess:
      type: object
      properties:
        pid: { type: integer }
        name: { type: string }
        memory_bytes: { type: integer, format: int64 }
        container_id: { type: string }
    GPUDevicesResponse:
      type: object
      required: [devices, gpu_enabled, nvidia_driver, nvidia_container_runtime]
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/GPUDevice' }
        gpu_enabled: { type: boolean }
        nvidia_driver: { type: boolean }
        nvidia_container_runtime: { type: boolean }
        processes:
          type: object
          description: GPU UUID → processes (approvers/managers/monitoring only).
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/GPUProcess' }
        inventory_error: { type: string }
    GPURequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        requester_id: { type: string, format: uuid }
        requester_username: { type: string }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        gpu_device_id: { type: [string, 'null'], format: uuid }
        gpu_name: { type: [string, 'null'] }
        mode: { type: string, enum: [exclusive, shared] }
        duration_hours: { type: integer }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected, cancelled] }
        reviewed_by_username: { type: [string, 'null'] }
        review_note: { type: [string, 'null'] }
        reviewed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    GPURequestEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/GPURequest' }
    GPUReviewInput:
      type: object
      additionalProperties: false
      properties:
        gpu_device_id: { type: string, format: uuid, description: Approve only. }
        note: { type: string, description: Required (≥ 3 characters) for reject. }
        duration_hours: { type: integer, minimum: 1, description: Approve only; may only shorten. }
    GPUAllocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        gpu_device_id: { type: string, format: uuid }
        gpu_name: { type: string }
        gpu_index: { type: integer }
        workspace_id: { type: string, format: uuid }
        workspace_name: { type: string }
        user_id: { type: string, format: uuid }
        username: { type: string }
        mode: { type: string, enum: [exclusive, shared] }
        status: { type: string, enum: [active, released, expired] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        released_at: { type: [string, 'null'], format: date-time }
        release_reason: { type: [string, 'null'] }
    GPUInventory:
      type: object
      properties:
        available: { type: boolean }
        error: { type: string }
        gpus:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              uuid: { type: string }
              name: { type: string }
              driver_version: { type: string }
              cuda_version: { type: string }
              memory_total_bytes: { type: [integer, 'null'], format: int64 }
              memory_used_bytes: { type: [integer, 'null'], format: int64 }
              utilization_pct: { type: [integer, 'null'] }
              temperature_c: { type: [integer, 'null'] }
              power_draw_w: { type: [number, 'null'] }
              mig_mode: { type: string }
              processes:
                type: [array, 'null']
                items: { $ref: '#/components/schemas/GPUProcess' }

    # ----- monitoring -----
    HostMetrics:
      type: object
      properties:
        collected_at: { type: string, format: date-time }
        cpu_percent: { type: number }
        per_core:
          type: [array, 'null']
          items: { type: number }
        load1: { type: number }
        load5: { type: number }
        load15: { type: number }
        memory_total: { type: integer, format: int64 }
        memory_used: { type: integer, format: int64 }
        memory_available: { type: integer, format: int64 }
        swap_total: { type: integer, format: int64 }
        swap_used: { type: integer, format: int64 }
        disks:
          type: [array, 'null']
          items:
            type: object
            properties:
              mountpoint: { type: string }
              fstype: { type: string }
              total: { type: integer, format: int64 }
              used: { type: integer, format: int64 }
              free: { type: integer, format: int64 }
        net_rx_bytes_per_sec: { type: number }
        net_tx_bytes_per_sec: { type: number }
        uptime_seconds: { type: integer, format: int64 }
        docker:
          type: object
          properties:
            available: { type: boolean }
            version: { type: string }
            error: { type: string }
            containers_running: { type: integer }
            containers_stopped: { type: integer }
            containers_paused: { type: integer }
            images: { type: integer }
    HostMonitoring:
      type: object
      required: [available, live]
      properties:
        available: { type: boolean }
        live: { type: boolean }
        metrics: { $ref: '#/components/schemas/HostMetrics' }
        error: { type: string }
        last_sample:
          type: object
          properties:
            cpu_percent: { type: [number, 'null'] }
            load1: { type: [number, 'null'] }
            memory_used: { type: [integer, 'null'] }
            memory_total: { type: [integer, 'null'] }
            disk_used: { type: [integer, 'null'] }
            disk_total: { type: [integer, 'null'] }
            net_rx_bytes_per_sec: { type: [number, 'null'] }
            net_tx_bytes_per_sec: { type: [number, 'null'] }
            collected_at: { type: string, format: date-time }
        node:
          oneOf:
            - $ref: '#/components/schemas/AgentNode'
            - type: 'null'
    WorkspaceMetrics:
      type: object
      properties:
        workspace_id: { type: string, format: uuid }
        storage_bytes: { type: integer, format: int64 }
        storage_used_bytes: { type: [integer, 'null'], format: int64 }
        cpu_limit_millis: { type: integer }
        memory_limit_bytes: { type: integer, format: int64 }
        error: { type: string }
        containers:
          type: array
          items:
            type: object
            properties:
              container_id: { type: string, format: uuid }
              name: { type: string }
              cpu_percent: { type: number }
              memory_bytes: { type: integer, format: int64 }
              memory_limit: { type: integer, format: int64 }
              pids: { type: integer }
              net_rx_bytes: { type: integer, format: int64 }
              net_tx_bytes: { type: integer, format: int64 }
    MetricsHistory:
      type: object
      properties:
        scope: { type: string }
        ref: { type: string }
        bucket_seconds: { type: integer }
        points:
          type: array
          items:
            type: object
            properties:
              t: { type: string, format: date-time }
              cpu_pct: { type: [number, 'null'] }
              memory_bytes: { type: [number, 'null'] }
              memory_total_bytes: { type: [number, 'null'] }
              disk_used_bytes: { type: [number, 'null'] }
              net_rx_bytes_per_sec: { type: [number, 'null'] }
              net_tx_bytes_per_sec: { type: [number, 'null'] }
              load1: { type: [number, 'null'] }
              gpu_util_pct: { type: [number, 'null'] }
              gpu_memory_bytes: { type: [number, 'null'] }
              gpu_temperature_c: { type: [number, 'null'] }
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        rule:
          type: string
          enum: [agent_offline, disk_full, memory_critical, cpu_sustained_high, docker_unavailable, gpu_temperature, gpu_overutilized, queue_backlog, jobs_failed, backup_failed, backup_missing, service_down]
        subject: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [firing, resolved] }
        message: { type: string }
        value: { type: [number, 'null'] }
        started_at: { type: string, format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        acknowledged_by_username: { type: [string, 'null'] }
        acknowledged_at: { type: [string, 'null'], format: date-time }
    ServicesStatus:
      type: object
      properties:
        services:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [api, postgresql, redis, worker, agent, web] }
              status: { type: string, enum: [up, down, degraded, unknown, not_configured] }
              detail: { type: string }
              latency_ms: { type: integer }
        queue: { $ref: '#/components/schemas/QueueStats' }
        last_backup:
          type: object
          properties:
            status: { type: [string, 'null'] }
            finished_at: { type: [string, 'null'], format: date-time }
            kind: { type: [string, 'null'] }
        containers_by_status:
          type: object
          additionalProperties: { type: integer }
        prometheus_url: { type: string }
        grafana_url: { type: string }
    QueueStats:
      type: object
      properties:
        queued: { type: integer, description: Due queued jobs. }
        running: { type: integer }
        failed_24h: { type: integer, description: Jobs that went dead in the last 24 h. }
        dead: { type: integer }
        oldest_queued_seconds: { type: integer }
    JobRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [queued, running, dead] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        last_error: { type: [string, 'null'] }
        resource_type: { type: [string, 'null'] }
        resource_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ----- notifications -----
    NotificationType:
      type: string
      enum: [system, workspace, gpu, quota, maintenance, security, backup, alert]
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        severity: { type: string, enum: [info, success, warning, critical] }
        title: { type: string }
        body: { type: string }
        link: { type: [string, 'null'], description: 'Console-relative link, e.g. /workspaces/{id}.' }
        read_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        created_by_username: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    # ----- admin -----
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: [string, 'null'], format: uuid }
        actor_username: { type: [string, 'null'] }
        action: { type: string, examples: [workspace.emergency_access] }
        resource_type: { type: string }
        resource_id: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        reason: { type: [string, 'null'] }
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        metadata:
          type: object
          additionalProperties: true
    Capabilities:
      type: object
      properties:
        docker: { type: boolean }
        docker_version: { type: string }
        docker_error: { type: string }
        nvidia: { type: boolean }
        nvidia_runtime: { type: boolean }
        native_workspaces: { type: boolean }
        storage_driver: { type: string, enum: [loopback, directory] }
        storage_enforced: { type: boolean }
        apparmor: { type: boolean }
        seccomp: { type: boolean }
    AgentNode:
      type: object
      properties:
        name: { type: string, examples: [local] }
        hostname: { type: [string, 'null'] }
        agent_version: { type: [string, 'null'] }
        protocol_version: { type: [integer, 'null'] }
        os: { type: [string, 'null'] }
        kernel: { type: [string, 'null'] }
        arch: { type: [string, 'null'] }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
        host_info:
          type: object
          properties:
            cpu_model: { type: string }
            cpu_cores: { type: integer }
            cpu_threads: { type: integer }
            memory_total: { type: integer, format: int64 }
            boot_time: { type: string, format: date-time }
        status: { type: string, enum: [online, offline, degraded, unknown], description: offline when not seen for 2 minutes. }
        last_error: { type: [string, 'null'] }
        last_seen_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
        expected_protocol_version: { type: integer }
    AgentStatus:
      type: object
      description: Either `node` (+ `live_error` when the live check failed) or, if the agent never reported, `status`/`error`/`expected_protocol_version`.
      properties:
        node: { $ref: '#/components/schemas/AgentNode' }
        live_error: { type: string }
        status: { type: string, enum: [unknown] }
        error: { type: string }
        expected_protocol_version: { type: integer }
    Setting:
      type: object
      required: [key, type, default, description, category, value]
      properties:
        key: { type: string, examples: [alerts.disk_pct] }
        type: { type: string, enum: [bool, int, string, enum] }
        default: { type: [string, integer, boolean] }
        min: { type: integer }
        max: { type: integer }
        options:
          type: array
          items: { type: string }
        description: { type: string }
        category: { type: string }
        value: { type: [string, integer, boolean] }
    SettingsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Setting' }
    BackupJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [platform_db, config, workspace_metadata, workspace_files, project_databases, full] }
        status: { type: string, enum: [queued, running, succeeded, failed, expired] }
        trigger: { type: string, enum: [manual, scheduled, pre_upgrade] }
        file_name: { type: [string, 'null'] }
        size_bytes: { type: [integer, 'null'], format: int64 }
        checksum_sha256: { type: [string, 'null'] }
        encrypted: { type: boolean }
        error: { type: [string, 'null'] }
        triggered_by_username: { type: [string, 'null'] }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        restore_status: { type: [string, 'null'], enum: [queued, running, succeeded, failed, null] }
        restored_at: { type: [string, 'null'], format: date-time }
        restore_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    BackupConfig:
      type: object
      properties:
        encryption_configured: { type: boolean }
        offsite_copy_configured: { type: boolean }
        retention_days: { type: integer }
        schedule_enabled: { type: boolean }
        schedule_hour_utc: { type: integer }
        project_databases: { type: boolean }
