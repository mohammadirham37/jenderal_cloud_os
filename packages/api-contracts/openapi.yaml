        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/workspaces/{id}/files/mkdir:
    post:
      tags: [Files]
      operationId: makeDirectory
      summary: Create a directory (parent must exist)
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/AccessReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '201':
          description: Created directory entry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FileEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/workspaces/{id}/files/rename:
    patch:
      tags: [Files]
      operationId: renameFile
      summary: Rename or move within the workspace (audited)
      description: The destination must not exist; a folder cannot be moved into itself.
      security:
        - cookieAuth: []
          csrfToken: []
