  # ---------------------------------------------------------------------------
  # Workspaces
  # ---------------------------------------------------------------------------
  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      operationId: listWorkspaces
      summary: List visible workspaces (workspaces.view_own, view_all or manage_all)
      description: Without view_all/manage_all/access_all only owned workspaces, workspaces the caller is a member of and workspaces of the caller's projects are returned. `access` is the caller's effective level.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, status, -status, updated_at, -updated_at]
            default: -created_at
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WorkspaceStatus' }
        - name: mine
          in: query
          schema: { type: boolean }
        - name: owner_id
          in: query
          schema: { type: string, format: uuid }
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page of workspaces.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace (workspaces.create) — asynchronous
      description: |
        Validates quota (CPU/memory within the package, workspace/container count, allocated
        storage, GPU-required templates) and schedules the `workspace.provision` job.
        Returns 202 with status `requested`. Supports `Idempotency-Key`.
        `type: native` requires WORKSPACE_NATIVE_ENABLED and the `workspaces.native` permission;
        `owner_id` for another user requires `workspaces.manage_all`.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' }
      responses:
        '202':
          description: 'Accepted; provisioning scheduled. A replayed request carries `Idempotent-Replay: true`.'
          headers:
            Idempotent-Replay:
              description: '`true` when the stored response of an earlier request with the same key is returned.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/workspaces/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Workspace detail (view access)
      description: 404 when the caller has no access at all (existence is not leaked); deleted workspaces are 404.
      responses:
        '200':
          description: Detail with containers, template, members and grants.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkspaceDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Update workspace settings (manage access)
      description: CPU/memory changes require a stopped workspace; the primary container is removed and recreated with the new limits on next start (data stays on the volume). `idle_timeout_min = 0` disables idle stop.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                idle_timeout_min: { type: integer, description: '0 (disabled) or 5–10080.' }
                cpu_millis: { type: integer, description: Between the template minimum and the owner's quota. }
                memory_bytes: { type: integer, format: int64, description: Between the template minimum and the owner's quota. }
      responses:
        '200':
          description: Updated detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/WorkspaceDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Workspaces]
      operationId: deleteWorkspace
      summary: Delete a workspace — asynchronous
      description: Owner with workspaces.delete, or manage access with workspaces.manage_all. Allowed from ready, stopped, suspended and failed. Status becomes `deleting`; the `workspace.delete` job removes containers, network, storage and releases GPU allocations.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: reason
          in: query
          schema: { type: string }
      responses:
        '202':
          description: Deletion scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/workspaces/{id}/start:
    post:
      tags: [Workspaces]
      operationId: startWorkspace
      summary: Start a workspace (operate access) — asynchronous
      description: Checks the running CPU/memory quota of the owner (and project) and host capacity (memory ≤ 90 % of RAM, CPU ≤ `scheduler.cpu_overcommit_pct`). Starting a suspended workspace requires workspaces.manage_all.
