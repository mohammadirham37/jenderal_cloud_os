                  data: { $ref: '#/components/schemas/FileEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  # ---------------------------------------------------------------------------
  # Terminals
  # ---------------------------------------------------------------------------
  /api/v1/workspaces/{id}/terminals:
    post:
      tags: [Terminals]
      operationId: createTerminal
      summary: Create a terminal session (terminals.open + edit access)
      description: |
        The workspace must be running. Limited by the quota's `max_terminal_sessions`.
        Emergency access (workspaces.access_all) requires `X-Access-Reason`; the reason is
        stored with the session and reused on reconnect. Session lifetime is
        TERMINAL_SESSION_TTL_MINUTES.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/AccessReason'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                container_id: { type: string, format: uuid, description: Defaults to the primary running container. }
                cols: { type: integer, minimum: 10, maximum: 1000, default: 120 }
                rows: { type: integer, minimum: 5, maximum: 500, default: 32 }
      responses:
        '201':
          description: Session created (status `pending`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/TerminalSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/terminals:
    get:
      tags: [Terminals]
      operationId: listTerminals
      summary: Own open sessions and sessions ended in the last hour (max 50)
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TerminalSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/terminals/{id}:
    delete:
      tags: [Terminals]
      operationId: closeTerminal
      summary: Close own terminal session
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Closed (an attached relay notices within 15 s).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/terminals/{id}/ws:
    get:
      tags: [Terminals]
      operationId: terminalWebSocket
      summary: Attach to a terminal session (WebSocket upgrade)
      description: |
        WebSocket endpoint (`wss://<host>/api/v1/terminals/{id}/ws`). Authenticated with the
        session cookie; the `Origin` must be the APP_BASE_URL host. No secrets are passed in
        the query string. On every (re)connect the API re-validates the terminal session
        (owner, not expired/closed), the workspace access level (edit) and that the workspace
        is running. Each reconnect starts a **new shell**.

        Frames: binary frames carry raw terminal bytes in both directions. Text frames from
        the client carry JSON control messages: `{"type":"resize","cols":N,"rows":N}` or
        `{"type":"ping"}`. The relay re-checks every 15 s that the terminal session is not
        closed, the login session is still valid and the workspace is running.
        Close reasons include `expired`, `session_closed`, `login_session_ended`,
        `workspace_stopped`, `shell_exited`, `idle_timeout`, `max_duration`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, const: websocket }
      responses:
        '101':
          description: Switching protocols; the WebSocket relay is established.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: '`terminal_session_ended` — open a new terminal.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ---------------------------------------------------------------------------
  # App proxy (only on APP_PROXY_ORIGIN)
  # ---------------------------------------------------------------------------
  /api/v1/workspaces/{id}/proxy/{port}:
    get:
      tags: [AppProxy]
      operationId: appProxyRedirect
      summary: Redirect to the trailing-slash form of the app URL
      description: Any method is accepted; the response is always a 302 to `.../proxy/{port}/`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ProxyPort'
      responses:
        '302':
          description: Redirect.
          headers:
            Location:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workspaces/{id}/proxy/{port}/{path}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/ProxyPort'
      - $ref: '#/components/parameters/ProxyPath'
    get:
      tags: [AppProxy]
      operationId: appProxyGet
      summary: Proxy a request to a web app in the workspace
      description: |
        Served **only** when the request Host equals APP_PROXY_ORIGIN (404 on the console
        origin; 503 when APP_PROXY_ORIGIN is empty). Requires edit access as owner or editor
        (emergency access is refused). The workspace must be running and the port must be a
        published template port of a running container. The upstream is
        `127.0.0.1:<loopback host port>`. The `itk_session` cookie, `X-CSRF-Token` and
        `Authorization` are stripped before forwarding; `Set-Cookie: itk_session=...` from
        the app is dropped. All HTTP methods (and WebSocket upgrades) are forwarded; CSRF
        token checks do not apply to this path. Response bodies are whatever the app returns.
      responses:
        '200':
          description: Upstream response (any status code is passed through).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: '`app_unreachable` — nothing is listening on the port.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [AppProxy]
      operationId: appProxyPost
      summary: Proxy a POST request to a web app in the workspace
      description: See `appProxyGet`.
      responses:
        '200':
          description: Upstream response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: '`app_unreachable`.'
    put:
      tags: [AppProxy]
      operationId: appProxyPut
      summary: Proxy a PUT request to a web app in the workspace
      description: See `appProxyGet`.
      responses:
        '200':
          description: Upstream response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [AppProxy]
      operationId: appProxyPatch
      summary: Proxy a PATCH request to a web app in the workspace
      description: See `appProxyGet`.
      responses:
        '200':
          description: Upstream response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [AppProxy]
      operationId: appProxyDelete
      summary: Proxy a DELETE request to a web app in the workspace
      description: See `appProxyGet`.
      responses:
        '200':
          description: Upstream response.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Containers
  # ---------------------------------------------------------------------------
  /api/v1/containers:
    get:
      tags: [Containers]
      operationId: listContainers
      summary: List containers of visible workspaces
      description: Without containers.manage_all / workspaces.view_all / workspaces.manage_all only containers of owned, member or project workspaces are returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, created_at, -created_at, status, -status]
            default: -created_at
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ContainerStatus' }
        - name: workspace_id
          in: query
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Page of containers.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Container' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Containers]
      operationId: createContainer
      summary: Add a container to a workspace (containers.create + edit access) — asynchronous
      description: The additional container shares the workspace volume (`/home/jenderal`) and network. Counts toward `max_containers`. Supports `Idempotency-Key`.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id, template_id, name]
              properties:
                workspace_id: { type: string, format: uuid }
                template_id: { type: string, format: uuid }
                name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$' }
                cpu_millis: { type: integer, description: Defaults to the template recommendation. }
                memory_bytes: { type: integer, format: int64, description: Defaults to the template recommendation. }
      responses:
        '202':
          description: Container recorded; `container.create` job scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/containers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Containers]
      operationId: getContainer
      summary: Container detail with live runtime state and stats (view access)
      responses:
        '200':
          description: Detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/ContainerDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Containers]
      operationId: deleteContainer
      summary: Remove an additional (non-primary) container (edit access) — asynchronous
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/AccessReason'
      responses:
        '204':
          description: Removal scheduled (`container.remove` job).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/containers/{id}/logs:
    get:
      tags: [Containers]
      operationId: getContainerLogs
      summary: Recent container log lines (operate access or containers.manage_all)
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: tail
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 200 }
        - name: timestamps
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Log lines (agent truncates at 4 MiB).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/LogsResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/containers/{id}/start:
    post:
      tags: [Containers]
      operationId: startContainer
      summary: Start a container (operate access + containers.stop or containers.manage_all) — asynchronous
      description: Checks quota and host capacity like a workspace start.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          $ref: '#/components/responses/ContainerAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/containers/{id}/stop:
    post:
      tags: [Containers]
      operationId: stopContainer
      summary: Stop a container — asynchronous
      description: Stopping the last running container marks the workspace stopped.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          $ref: '#/components/responses/ContainerAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/containers/{id}/restart:
    post:
      tags: [Containers]
      operationId: restartContainer
      summary: Restart a running container — asynchronous
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          $ref: '#/components/responses/ContainerAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------------------
  # Databases
  # ---------------------------------------------------------------------------
  /api/v1/databases:
    get:
      tags: [Databases]
      operationId: listDatabases
      summary: List project databases (own projects; all with databases.manage_all / projects.view_all)
      parameters:
        - name: project_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Databases and whether the feature is configured (PROJECT_DB_ADMIN_URL).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [databases, enabled]
                    properties:
                      databases:
                        type: array
                        items: { $ref: '#/components/schemas/Database' }
                      enabled: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Databases]
      operationId: createDatabase
      summary: Create a project database (databases.create + project maintainer) — asynchronous
      description: Returns the generated credentials **once**. Checks the creator's `max_databases` and the project quota. Supports `Idempotency-Key`. 503 when PROJECT_DB_ADMIN_URL is not configured.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id, display_name]
              properties:
                project_id: { type: string, format: uuid }
                display_name: { type: string, minLength: 1, maxLength: 80 }
                connection_limit: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '202':
          description: Database recorded (status `provisioning`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [database, credentials]
                    properties:
                      database: { $ref: '#/components/schemas/Database' }
                      credentials: { $ref: '#/components/schemas/DatabaseCredentials' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/databases/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Databases]
      operationId: getDatabase
      summary: Get a database (project role member or databases.manage_all); never includes the password
      responses:
        '200':
          description: Database.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Database' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Databases]
      operationId: deleteDatabase
      summary: Drop a database (maintainer + databases.delete or databases.manage_all) — asynchronous
      description: '`confirm` must equal the database name (`db_name`). Allowed from ready or failed.'
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deletion scheduled (`database.delete` job).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/databases/{id}/credentials/reset:
    post:
      tags: [Databases]
      operationId: resetDatabaseCredentials
      summary: Generate a new password (project maintainer); returned once
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: New credentials.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DatabaseCredentials' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  # ---------------------------------------------------------------------------
  # GPU
  # ---------------------------------------------------------------------------
  /api/v1/gpu/devices:
    get:
      tags: [GPU]
      operationId: listGPUDevices
      summary: GPU inventory (gpu.view, gpu.manage or gpu.approve)
      description: Live processes are included for gpu.manage, gpu.approve or monitoring.view_host.
      responses:
        '200':
          description: Inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GPUDevicesResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/gpu/devices/{id}:
    patch:
      tags: [GPU]
      operationId: updateGPUDevice
      summary: Set allocation policy / disable a GPU (gpu.manage)
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                allocation_policy: { type: string, enum: [exclusive, shared, disabled] }
                max_shared: { type: integer, minimum: 1, maximum: 16 }
                disabled: { type: boolean }
      responses:
        '200':
          description: Updated device.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GPUDevice' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/gpu/requests:
    get:
      tags: [GPU]
      operationId: listGPURequests
      summary: GPU requests (own; all with gpu.approve) — max 200
      parameters:
        - name: mine
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected, cancelled] }
      responses:
        '200':
          description: Requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GPURequest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [GPU]
      operationId: createGPURequest
      summary: Request GPU access for a container workspace (gpu.request + edit access)
      description: Requires GPU_ENABLED (503 otherwise) and a quota package with `gpu_allowed`. One pending request per workspace. `shared` mode only when `gpu.allow_shared` is on.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id, duration_hours, reason]
              properties:
                workspace_id: { type: string, format: uuid }
                gpu_device_id: { type: string, format: uuid }
                mode: { type: string, enum: [exclusive, shared], default: exclusive }
                duration_hours: { type: integer, minimum: 1, description: 'At most `gpu.max_duration_hours` (default 72).' }
                reason: { type: string, minLength: 10, maxLength: 2000 }
      responses:
        '201':
          description: Request created; approvers are notified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPURequestEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/gpu/requests/{id}/approve:
    post:
      tags: [GPU]
      operationId: approveGPURequest
      summary: Approve and allocate a GPU (gpu.approve; own requests only with gpu.manage)
      description: Picks (or validates) a device for the mode; a running workspace is restarted to attach the GPU. `duration_hours` may only shorten the request.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GPUReviewInput' }
      responses:
        '200':
          description: Approved request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPURequestEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/gpu/requests/{id}/reject:
    post:
      tags: [GPU]
      operationId: rejectGPURequest
      summary: Reject a pending request (gpu.approve; note required)
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GPUReviewInput' }
      responses:
        '200':
          description: Rejected request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GPURequestEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/gpu/requests/{id}/cancel:
    post:
      tags: [GPU]
      operationId: cancelGPURequest
      summary: Cancel own pending request
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Cancelled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/gpu/allocations:
    get:
      tags: [GPU]
      operationId: listGPUAllocations
      summary: GPU allocations (own; all with gpu.approve, gpu.manage or monitoring.view_host) — max 200
      parameters:
        - name: status
          in: query
          description: '`active` limits to active allocations; otherwise history is included.'
          schema: { type: string, enum: [active] }
        - name: mine
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Allocations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GPUAllocation' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/gpu/allocations/{id}/release:
    post:
      tags: [GPU]
      operationId: releaseGPUAllocation
      summary: Release an allocation (its user, gpu.approve or gpu.manage)
      description: A running workspace is restarted to detach the GPU.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        $ref: '#/components/requestBodies/OptionalReason'
      responses:
        '200':
          description: Released allocation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/GPUAllocation' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

