openapi: 3.1.0
info:
  title: Jenderal Cloud OS API
  version: 1.0.0
  summary: REST API of Jenderal Cloud OS, the private cloud platform of the Informatics & Computer Engineering laboratory.
  description: |
    Contract for every route registered in `internal/app/api.go`. The Go handlers in
    `internal/modules/**` are the source of truth; this document is derived from their
    request structs (`json` tags), response structs and authorization checks.

    ## Conventions

    * All application endpoints live under `/api/v1`; health probes under `/health`.
    * Successful responses use the envelope `{"data": ...}`. Paginated lists use
      `{"data": [...], "meta": {"page", "per_page", "total"}}`.
    * Errors always use `{"error": {"code", "message", "details"?, "request_id"?}}`.
      `details` maps field names to messages (HTTP 422 `validation_failed`).
    * JSON request bodies are decoded strictly: unknown fields are rejected (400) and the
      body is limited to 1 MiB (uploads stream separately).
    * Long-running operations (provisioning, lifecycle actions, backups, restores, database
      provisioning) return **202 Accepted** with the current resource state; the work is
      done by background jobs. Poll the resource (e.g. `GET /api/v1/workspaces/{id}`,
      `pending_job` field) or `GET /api/v1/workspaces/{id}/jobs`.
    * Every response carries `X-Request-ID` (a sane inbound `X-Request-ID` header is reused).

    ## Authentication

    Session cookie `itk_session` (HttpOnly, SameSite=Lax, Secure when `COOKIE_SECURE`).
    Unsafe methods (POST, PUT, PATCH, DELETE) of an authenticated session must send the
    per-session CSRF token from `GET /api/v1/auth/me` (`csrf_token`) in `X-CSRF-Token`; when
    an `Origin` header is present it must equal the origin of `APP_BASE_URL`.
    Sessions that still need MFA or a password change can only reach the endpoints listed
    in docs/api.md (other requests return 403 `mfa_required` / `password_change_required`).

    See docs/api.md for the human-oriented guide (permissions per endpoint, rate limits).
  contact:
    name: Jenderal Cloud OS administrators
  license:
    name: Proprietary – internal use
    identifier: LicenseRef-ITK-Cloud-Proprietary
servers:
  - url: https://itk-cloud.local
    description: Production console origin (APP_BASE_URL). Workspace app proxy routes are served only on APP_PROXY_ORIGIN.
  - url: http://localhost:5173
    description: Development (Vite dev server proxies /api and /health to the API on 127.0.0.1:8080).
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness and readiness probes (no authentication).
  - name: Config
    description: Public, non-sensitive UI configuration.
  - name: Auth
    description: Login, logout, sessions, password change/reset and TOTP MFA.
  - name: Dashboard
    description: Dashboard summary and own resource usage.
  - name: Users
    description: User accounts (RBAC with role ranks).
  - name: Roles
    description: Roles and the permission catalog.
  - name: Quotas
    description: Quota packages.
  - name: Projects
    description: Projects, members and project activity.
  - name: Templates
    description: Workspace template catalog.
  - name: Images
    description: Container image allowlist.
  - name: Workspaces
    description: Workspace lifecycle, settings, members and jobs.
  - name: Files
    description: Workspace file manager (paths are workspace-relative).
  - name: Terminals
    description: Browser terminal sessions and the WebSocket relay.
  - name: AppProxy
    description: Authenticated reverse proxy to web apps inside workspaces (served only on APP_PROXY_ORIGIN).
  - name: Containers
    description: Containers belonging to workspaces.
  - name: Databases
    description: PostgreSQL databases for projects.
  - name: GPU
    description: GPU inventory, requests, approvals and allocations.
  - name: Monitoring
    description: Host/workload metrics, history, alerts, service status and failed jobs.
  - name: Notifications
    description: In-app notifications and administrator announcements.
  - name: Admin
    description: Audit log, agent status, platform settings, backups and emergency operations.

paths:
  # ---------------------------------------------------------------------------
  # Health & config
  # ---------------------------------------------------------------------------
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
        '500':
          $ref: '#/components/responses/InternalError'
  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      summary: Readiness probe (database, Redis, migrations)
      description: Returns 503 when PostgreSQL or Redis is unreachable or migrations are pending. Not wrapped in the data envelope.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }
  /api/v1/config:
    get:
      tags: [Config]
      operationId: getPublicConfig
      summary: Public UI configuration
      security: []
      responses:
        '200':
          description: Configuration.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PublicConfig' }
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with username (or email) and password
      description: |
        Sets the `itk_session` cookie. If MFA is required the session starts unverified
        (10 minute lifetime) and `mfa_required`/`mfa_verified` tell the client to call
        `/auth/mfa/verify` or enroll via `/auth/mfa/setup`. Rate limited per IP (30 / 10 min)
        and per username (10 / 15 min); fails closed (503) if Redis is unavailable.
        Accounts are locked after `security.login_max_attempts` failures (HTTP 423).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in. `Set-Cookie` carries the session.
          headers:
            Set-Cookie:
              description: '`itk_session=<token>; Path=/; HttpOnly; SameSite=Lax[; Secure]`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeEnvelope' }
        '401':
          description: '`invalid_credentials` (identical for unknown users and wrong passwords).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: '`account_suspended` or `csrf_failed` (foreign Origin).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '423':
          description: '`account_locked` — too many failed attempts.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset email
      description: Always 202 (never reveals whether the account exists). A reset link is only sent when SMTP is configured; `email_delivery` reports that.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      email_delivery: { type: boolean }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with a single-use reset token
      description: The token comes from the URL fragment `#token=` of the reset link (valid 1 hour). All sessions of the user are revoked and the lockout is cleared.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, maxLength: 100 }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204':
          description: Password changed.
        '400':
          description: '`invalid_token` — invalid, used or expired token.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '204':
          description: Logged out; cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user, permissions, MFA state and CSRF token
      description: Reachable while MFA or a password change is pending.
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change own password
      description: Revokes all other sessions of the user. Rate limited (10 / 15 min per user).
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '204':
          description: Changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: mfaSetup
      summary: Start TOTP enrollment
      description: Creates (or replaces) an unconfirmed TOTP secret and returns it once. 409 if MFA is already enabled.
      security:
        - cookieAuth: []
          csrfToken: []
      responses:
        '200':
          description: Secret for the authenticator app.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [secret, otpauth_uri]
                    properties:
                      secret: { type: string, description: Base32 secret (160 bit). }
                      otpauth_uri: { type: string, description: 'otpauth://totp/... URI (SHA1, 6 digits, 30 s).' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/mfa/enable:
    post:
      tags: [Auth]
      operationId: mfaEnable
      summary: Confirm TOTP enrollment and receive recovery codes
      description: Returns 10 one-time recovery codes (shown once) and rotates the session (new cookie). Rate limited (10 / 10 min per user).
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFACodeRequest' }
      responses:
        '200':
          description: MFA enabled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [recovery_codes, me]
                    properties:
                      recovery_codes:
                        type: array
                        items: { type: string, examples: [ABCDE-FGHJK] }
                      me: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: mfaVerify
      summary: Complete MFA for the current session
      description: Accepts a TOTP `code` (replays of an already used time step are rejected) or a `recovery_code` (consumed). Rotates the session. Rate limited (10 / 10 min per user).
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MFACodeRequest' }
      responses:
        '200':
          description: Session verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: mfaDisable
      summary: Disable own MFA
      description: Requires password and a current TOTP code. Forbidden when the user's role requires MFA and `security.require_mfa_for_admins` is on.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password, code]
              properties:
                password: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '204':
          description: MFA removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: List own active sessions (max 50)
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SessionView' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: Revoke one of own sessions
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Dashboard
  # ---------------------------------------------------------------------------
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Dashboard summary for the current user
      description: The `platform` block is included only for holders of `monitoring.view_host`.
      responses:
        '200':
          description: Summary.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/DashboardSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/usage:
    get:
      tags: [Dashboard]
      operationId: getMyUsage
      summary: Effective quota and current usage of the caller
      responses:
        '200':
          description: Quota and usage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotaUsageEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (users.view)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
        - name: sort
          in: query
          description: Sort field, prefix `-` for descending.
          schema:
            type: string
            enum: [username, -username, full_name, -full_name, created_at, -created_at, last_login_at, -last_login_at, email, -email]
            default: username
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended] }
        - name: role
          in: query
          description: Role key filter.
          schema: { type: string }
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user (users.create)
      description: |
        Roles can only be granted when their rank is lower than the caller's highest rank
        (equal rank allowed with `roles.manage`). Without `password` a 16-character temporary
        password is generated and returned once; the user must change it at first login.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user]
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      temporary_password: { type: string, description: Present only when the password was generated. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/users/lookup:
    get:
      tags: [Users]
      operationId: lookupUsers
      summary: Search active users for member pickers (users.lookup or users.view)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
      responses:
        '200':
          description: Up to 10 matches.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/UserRef' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user (self or users.view)
      description: Returns 404 (not 403) when the caller may not view the user.
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user
      description: |
        Users may change their own `full_name`. Other fields need `users.update`; `roles`
        needs `users.assign_roles` or `roles.manage` and cannot be changed on oneself.
        The target must have a lower rank (equal with `roles.manage`). Changing roles revokes
        all sessions of the target. `quota_key: ""` clears the explicit quota package.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/users/{id}/suspend:
    post:
      tags: [Users]
      operationId: suspendUser
      summary: Suspend a user (users.suspend)
      description: Revokes all sessions, schedules suspension of the user's running workspaces and closes their terminals. Not allowed on oneself or on equal/higher ranks.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/users/{id}/activate:
    post:
      tags: [Users]
      operationId: activateUser
      summary: Reactivate a suspended user (users.suspend)
      description: Also clears a login lockout.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        description: An empty object `{}` is accepted.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserEnvelope' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/users/{id}/reset-password:
    post:
      tags: [Users]
      operationId: adminResetPassword
      summary: Issue a single-use password reset link (users.reset_password)
      description: The link is returned to the administrator (to hand over out of band) and emailed when SMTP is configured. Revokes the target's sessions. Not allowed on oneself or equal/higher ranks.
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reset link.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [reset_link, expires_in_seconds, emailed]
                    properties:
                      reset_link: { type: string, format: uri, description: '`<APP_BASE_URL>/reset-password#token=<token>`' }
                      expires_in_seconds: { type: integer, examples: [3600] }
                      emailed: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
