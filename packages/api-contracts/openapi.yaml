  # ---------------------------------------------------------------------------
  # Files (files.manage + edit access; X-Access-Reason for emergency access)
  # ---------------------------------------------------------------------------
  /api/v1/workspaces/{id}/files:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AccessReason'
    get:
      tags: [Files]
      operationId: listFiles
      summary: List a directory (max 5000 entries)
      description: Requires files.manage and edit access; workspace must be ready, running or stopped (409 otherwise).
      parameters:
        - $ref: '#/components/parameters/FilePath'
      responses:
        '200':
          description: Directory listing (directories first).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [path, entries, truncated]
                    properties:
                      path: { type: string }
                      entries:
                        type: array
                        items: { $ref: '#/components/schemas/FileEntry' }
                      truncated: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: Delete a file or directory (audited)
      description: Non-empty directories need `recursive=true` (409 otherwise). The workspace root cannot be deleted (422).
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: recursive
          in: query
          schema: { type: boolean }
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
