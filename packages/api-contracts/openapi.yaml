        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/workspaces/{id}/files/content:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/AccessReason'
    get:
      tags: [Files]
      operationId: readFileContent
      summary: Read a text file for the browser editor (≤ EDITOR_MAX_BYTES)
      description: Only supported text extensions/names; binary content returns 415 `binary_file`, unsupported types 415 `unsupported_file_type`, oversize 413.
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '200':
          description: File content.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FileContent' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    put:
      tags: [Files]
      operationId: writeFileContent
      summary: Save a text file from the editor (atomic replace)
      description: With `expected_mod_time` the write fails with 409 if the file changed since it was read. `create` allows creating a new file.
      security:
        - cookieAuth: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, content]
              properties:
                path: { type: string, minLength: 1, maxLength: 4096 }
                content: { type: string, description: At most EDITOR_MAX_BYTES (default 1 MiB). }
                expected_mod_time: { type: string, format: date-time }
                create: { type: boolean }
      responses:
        '200':
          description: Saved entry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/FileEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '507':
          $ref: '#/components/responses/InsufficientStorage'
  /api/v1/workspaces/{id}/files/upload:
    post:
      tags: [Files]
      operationId: uploadFiles
      summary: Upload files (multipart, streamed to the agent; audited)
      description: Each `file` part (max 100 per request) is written into `path` (a directory). Each file is limited to UPLOAD_MAX_BYTES. Existing files are not replaced unless `overwrite=true` (409).
      security:
        - cookieAuth: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/AccessReason'
        - name: path
          in: query
          description: Destination directory ("" = workspace root).
          schema: { type: string, maxLength: 4096 }
        - name: overwrite
          in: query
          schema: { type: boolean }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items: { type: string, contentMediaType: application/octet-stream }
      responses:
        '201':
